command:
  - uvicorn
  - app.main:app
  - --workers
  - "1"

env:
  - name: APP_ENV
    value: databricks
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  - name: GITHUB_TOKEN
    valueFrom: github_token
  - name: LLM_API_KEY
    valueFrom: openrouter_api_key
  - name: LLM_API_BASE_URL
    value: "https://openrouter.ai/api/v1"
  - name: LLM_MODEL_NAME
    value: "openrouter/free"
  - name: LLM_REQUEST_TIMEOUT
    value: "45"
  - name: LLM_MAX_OUTPUT_TOKENS
    value: "2000"
  - name: SEARCH_MIN_SIMILARITY
    value: "0.25"
  - name: SUPERVISOR_ENDPOINT_NAME
    valueFrom: supervisor_endpoint
  - name: SUPERVISOR_REQUEST_TIMEOUT_SECONDS
    value: "120"
  - name: SUPERVISOR_TASK_TIMEOUT_SECONDS
    value: "300"
